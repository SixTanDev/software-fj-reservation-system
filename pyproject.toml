[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "software-fj-reservation-system"
version = "0.1.0"
description = "Baseline tooling for the Software FJ academic reservation system project."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.3,<5.0",
    "pylint>=4.0,<5.0",
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra"]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.10"
jobs = 0
ignore-paths = ["^\\.venv/", "^build/", "^dist/"]

[tool.pylint.format]
max-line-length = 100

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
